name: BarGrader
options:
  bundleIdPrefix: com.bargrader
  deploymentTarget:
    iOS: "16.0"
    watchOS: "9.0"

settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.bargrader.app
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    INFOPLIST_FILE: BarGrader/Info.plist
    CODE_SIGN_ENTITLEMENTS: BarGrader/BarGrader.entitlements
    DEVELOPMENT_TEAM: K66F2V436N
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: false
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

targets:
  BarGrader:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: BarGrader
        type: group
        excludes:
          - "**/*.md"
    settings:
      base:
        INFOPLIST_FILE: BarGrader/Info.plist
        CODE_SIGN_ENTITLEMENTS: BarGrader/BarGrader.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.bargrader.app
        DEVELOPMENT_TEAM: K66F2V436N
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
    entitlements:
      path: BarGrader/BarGrader.entitlements
    info:
      path: BarGrader/Info.plist
      properties:
        CFBundleDisplayName: "Bartender"
        UIBackgroundModes: [audio, fetch, bluetooth-central, processing]
        NSMicrophoneUsageDescription: "Bartender needs your microphone to listen to your bar exam questions."
        NSSpeechRecognitionUsageDescription: "Bartender uses speech recognition for wake word detection."
        NSLocalNetworkUsageDescription: "Bartender connects to a local server on your network for AI-powered grading."
        NSBonjourServices: ["_http._tcp"]
        BGTaskSchedulerPermittedIdentifiers: ["com.bargrader.localllm"]
        ITSAppUsesNonExemptEncryption: false
        UIRequiredDeviceCapabilities: [arm64]
        UILaunchScreen:
          UIColorName: AccentColor

  BarGrader Watch App:
    type: application
    platform: watchOS
    deploymentTarget: "9.0"
    sources:
      - path: "BarGrader Watch App"
        type: group
    settings:
      base:
        INFOPLIST_FILE: "BarGrader Watch App/Info.plist"
        PRODUCT_BUNDLE_IDENTIFIER: com.bargrader.app.watchkitapp
        DEVELOPMENT_TEAM: K66F2V436N
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
    dependencies:
      - target: BarGrader
        embed: false

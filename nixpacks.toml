# ── Nixpacks config for Railway deployment ──
# Let Nixpacks auto-detect Python from requirements.txt + .python-version
# Do NOT override [phases.install] — Nixpacks handles pip in its own venv.

providers = ["python"]

[variables]
PYTHON_VERSION = "3.11"

[phases.setup]
nixPkgs = ["...", "gcc"]          # extend (not replace) default pkgs

[start]
cmd = "python3 -m uvicorn backend.app:app --host 0.0.0.0 --port ${PORT:-8080}"
